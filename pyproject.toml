[project]
name = "zen-studio"
version = "1.3"  # 包元数据副本：单一来源为 config/version.json，发版同步手改
description = "Agent 驱动的桌面 IDE：看代码、问 AI、跑命令，一个窗口全收——代码让 agent 写（本机 agent CLI 统一后端，零密钥）"
requires-python = ">=3.12"
dependencies = [
    "ptyprocess>=0.7.0",
    "pygments>=2.20.0",
    "pyside6>=6.11.1",
    "pyte>=0.8.2",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    # XTEST 真机驱动依赖（视觉验证闭环第二级「怎么动」用，见
    # 文档/修改记录/2026-0731-2208_聊天区选区高亮偏下修复与视觉验证闭环经验.md §6.2）。
    # 仅 .temp/ 验证脚本 import，生产代码零引用，PyInstaller 按 import 链
    # 收编不会打进包，无需 spec 级排除。
    "python-xlib>=0.33",
]
