[project]
name = "zen-studio"
version = "1.2"  # 包元数据副本：单一来源为 config/version.json，发版同步手改
description = "AI 优先的桌面 IDE：以本机 agent CLI 为统一后端（零密钥），集聊天、代码查看、文件树与真 PTY 终端于一体"
requires-python = ">=3.12"
dependencies = [
    "ptyprocess>=0.7.0",
    "pygments>=2.20.0",
    "pyside6>=6.11.1",
    "pyte>=0.8.2",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]
